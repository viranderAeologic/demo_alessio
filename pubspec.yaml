name: product_browser
description: "Flutter Product Browser - authenticates against DummyJSON, stores the token securely, and browses paginated products."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, routing and dependency injection.
  get: ^4.7.3

  # Platform-secure storage (Keychain on iOS, Keystore-backed on Android).
  flutter_secure_storage: ^11.2.0

  # HTTP client used by the shared ApiClient.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
